services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-backend-template
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DRIVER: postgresql
      DB_SCHEMA: ${DB_SCHEMA:-navi}
      DB_USERNAME: ${DB_USERNAME:-navi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MODEL_STORAGE_DIR: /app/storage/models
      LOG_DIR: /app/logs
    volumes:
      - ./.env:/app/.env:ro
      - app_logs:/app/logs
      - app_models:/app/storage/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - go-backend-template-network

  postgres:
    image: postgres:16-alpine
    container_name: go-backend-template-postgres
    environment:
      POSTGRES_DB: ${DB_SCHEMA:-navi}
      POSTGRES_USER: ${DB_USERNAME:-navi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-navi} -d ${DB_SCHEMA:-navi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - go-backend-template-network

volumes:
  postgres_data:
  app_logs:
  app_models:

networks:
  go-backend-template-network:
    name: go-backend-template-network
    driver: bridge
    attachable: true
